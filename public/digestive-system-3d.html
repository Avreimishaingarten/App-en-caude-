<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת העיכול - מודל תלת מימדי</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0d1b2a 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        canvas { display: block; }

        .header-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 30px;
            background: linear-gradient(180deg, rgba(10,14,39,0.9) 0%, transparent 100%);
            z-index: 10;
            text-align: center;
        }
        .header-overlay h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #ffa07a, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .header-overlay p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
        }

        .info-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,50,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 16px 24px;
            min-width: 300px;
            max-width: 90%;
            z-index: 10;
            text-align: center;
            transition: all 0.3s ease;
        }
        .info-panel h2 {
            font-size: 1.2rem;
            color: #ffa07a;
            margin-bottom: 6px;
        }
        .info-panel p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.5;
        }
        .info-panel .hint {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            margin-top: 8px;
        }

        .legend {
            position: fixed;
            top: 90px;
            right: 20px;
            background: rgba(20,20,50,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 18px;
            z-index: 10;
            font-size: 0.75rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .legend-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .controls-hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: rgba(255,255,255,0.25);
            z-index: 10;
            text-align: center;
        }

        @media (max-width: 600px) {
            .legend { display: none; }
            .header-overlay h1 { font-size: 1.4rem; }
            .info-panel { min-width: auto; width: 90%; }
        }
    </style>
</head>
<body>
    <div class="header-overlay">
        <h1>מערכת העיכול</h1>
        <p>מודל אינטראקטיבי תלת מימדי</p>
    </div>

    <div class="legend" id="legend"></div>

    <div id="canvas-container"></div>

    <div class="controls-hint">
        גרור לסיבוב | גלגל לזום | לחץ על איבר למידע
    </div>

    <div class="info-panel" id="info-panel">
        <h2>מערכת העיכול</h2>
        <p>לחץ על איבר כלשהו כדי ללמוד עליו. גרור כדי לסובב את המודל.</p>
        <div class="hint">מודל אינטראקטיבי תלת מימדי</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
    (function() {
        // ===== Scene Setup =====
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 20;
        controls.target.set(0, 0, 0);

        // ===== Lighting =====
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.0);
        mainLight.position.set(5, 8, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x6688cc, 0.4);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        const rimLight = new THREE.PointLight(0xff6b6b, 0.5, 20);
        rimLight.position.set(0, 5, -5);
        scene.add(rimLight);

        // ===== Organ Data =====
        const organInfo = {
            mouth: {
                name: 'חלל הפה',
                color: 0xe85d75,
                desc: 'תחילת תהליך העיכול. השיניים טוחנות את המזון והרוק מכיל אנזימים שמתחילים לפרק פחמימות.',
            },
            esophagus: {
                name: 'הוושט',
                color: 0xd4726a,
                desc: 'צינור שרירי באורך כ-25 ס"מ שמעביר את המזון מהפה לקיבה באמצעות תנועות פריסטלטיות.',
            },
            stomach: {
                name: 'הקיבה',
                color: 0xe8734a,
                desc: 'איבר שרירי שמכיל חומצה הידרוכלורית ואנזימים. מפרקת חלבונים ומערבבת את המזון לתערובת נוזלית.',
            },
            liver: {
                name: 'הכבד',
                color: 0x8b4513,
                desc: 'האיבר הפנימי הגדול ביותר. מייצר מרה, מסנן רעלים, מאחסן ויטמינים ומווסת סוכר בדם.',
            },
            gallbladder: {
                name: 'כיס המרה',
                color: 0x4a7c59,
                desc: 'אוגר ומרכז מרה שמיוצרת בכבד. משחרר מרה לתריסריון כדי לסייע בעיכול שומנים.',
            },
            pancreas: {
                name: 'הלבלב',
                color: 0xdaa520,
                desc: 'מפריש אנזימי עיכול לתריסריון ומייצר הורמונים כמו אינסולין לוויסות רמות הסוכר בדם.',
            },
            smallIntestine: {
                name: 'המעי הדק',
                color: 0xe89b7b,
                desc: 'אורכו כ-6 מטרים. כאן מתרחש עיקר ספיגת חומרי המזון לזרם הדם דרך סיסים זעירים.',
            },
            largeIntestine: {
                name: 'המעי הגס',
                color: 0xb07050,
                desc: 'אורכו כ-1.5 מטרים. סופג מים ומלחים מהמזון המעוכל ומכיל חיידקים מועילים.',
            },
            rectum: {
                name: 'החלחולת',
                color: 0x9b5e4a,
                desc: 'החלק האחרון של מערכת העיכול. אוגר את הפסולת עד להוצאתה מהגוף.',
            }
        };

        const clickableObjects = [];
        const allOrgans = {};

        function createMaterial(color, opacity = 0.85) {
            return new THREE.MeshPhysicalMaterial({
                color: color,
                transparent: true,
                opacity: opacity,
                roughness: 0.4,
                metalness: 0.1,
                clearcoat: 0.3,
                clearcoatRoughness: 0.2,
                side: THREE.DoubleSide,
            });
        }

        // ===== Create Organs =====

        // -- Mouth --
        function createMouth() {
            const group = new THREE.Group();
            const geo = new THREE.SphereGeometry(0.5, 32, 32);
            geo.scale(1, 0.7, 0.8);
            const mesh = new THREE.Mesh(geo, createMaterial(organInfo.mouth.color));
            mesh.position.set(0, 4.8, 0.3);
            mesh.userData = { organ: 'mouth' };
            group.add(mesh);
            clickableObjects.push(mesh);
            allOrgans.mouth = group;
            return group;
        }

        // -- Esophagus --
        function createEsophagus() {
            const group = new THREE.Group();
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 4.3, 0.3),
                new THREE.Vector3(0, 3.5, 0.15),
                new THREE.Vector3(0, 2.8, 0.05),
                new THREE.Vector3(0, 2.0, 0),
                new THREE.Vector3(0.1, 1.3, 0),
            ]);
            const geo = new THREE.TubeGeometry(curve, 20, 0.15, 12, false);
            const mesh = new THREE.Mesh(geo, createMaterial(organInfo.esophagus.color, 0.75));
            mesh.userData = { organ: 'esophagus' };
            group.add(mesh);
            clickableObjects.push(mesh);
            allOrgans.esophagus = group;
            return group;
        }

        // -- Stomach --
        function createStomach() {
            const group = new THREE.Group();
            // Main body
            const geo = new THREE.SphereGeometry(1, 32, 32);
            geo.scale(0.8, 1, 0.6);
            const mesh = new THREE.Mesh(geo, createMaterial(organInfo.stomach.color));
            mesh.position.set(0.3, 0.3, 0.2);
            mesh.rotation.z = -0.3;
            mesh.userData = { organ: 'stomach' };
            group.add(mesh);
            clickableObjects.push(mesh);

            // Fundus (upper bulge)
            const fundus = new THREE.SphereGeometry(0.5, 24, 24);
            const fundusMesh = new THREE.Mesh(fundus, createMaterial(organInfo.stomach.color, 0.8));
            fundusMesh.position.set(-0.2, 1.0, 0.2);
            fundusMesh.userData = { organ: 'stomach' };
            group.add(fundusMesh);
            clickableObjects.push(fundusMesh);

            allOrgans.stomach = group;
            return group;
        }

        // -- Liver --
        function createLiver() {
            const group = new THREE.Group();
            // Right lobe
            const rightLobe = new THREE.SphereGeometry(1.2, 32, 32);
            rightLobe.scale(1, 0.5, 0.7);
            const rightMesh = new THREE.Mesh(rightLobe, createMaterial(organInfo.liver.color, 0.8));
            rightMesh.position.set(-0.8, 1.5, 0.8);
            rightMesh.rotation.z = 0.2;
            rightMesh.userData = { organ: 'liver' };
            group.add(rightMesh);
            clickableObjects.push(rightMesh);

            // Left lobe
            const leftLobe = new THREE.SphereGeometry(0.7, 32, 32);
            leftLobe.scale(1, 0.4, 0.6);
            const leftMesh = new THREE.Mesh(leftLobe, createMaterial(organInfo.liver.color, 0.8));
            leftMesh.position.set(0.6, 1.4, 0.8);
            leftMesh.rotation.z = -0.15;
            leftMesh.userData = { organ: 'liver' };
            group.add(leftMesh);
            clickableObjects.push(leftMesh);

            allOrgans.liver = group;
            return group;
        }

        // -- Gallbladder --
        function createGallbladder() {
            const group = new THREE.Group();
            const geo = new THREE.SphereGeometry(0.25, 24, 24);
            geo.scale(0.6, 1.2, 0.6);
            const mesh = new THREE.Mesh(geo, createMaterial(organInfo.gallbladder.color));
            mesh.position.set(0.1, 1.0, 1.1);
            mesh.rotation.z = 0.3;
            mesh.userData = { organ: 'gallbladder' };
            group.add(mesh);
            clickableObjects.push(mesh);
            allOrgans.gallbladder = group;
            return group;
        }

        // -- Pancreas --
        function createPancreas() {
            const group = new THREE.Group();
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(1.2, -0.3, 0.3),
                new THREE.Vector3(0.5, -0.4, 0.2),
                new THREE.Vector3(-0.2, -0.5, 0.15),
                new THREE.Vector3(-0.8, -0.4, 0.2),
            ]);
            const geo = new THREE.TubeGeometry(curve, 20, 0.2, 12, false);
            const mesh = new THREE.Mesh(geo, createMaterial(organInfo.pancreas.color, 0.8));
            mesh.userData = { organ: 'pancreas' };
            group.add(mesh);
            clickableObjects.push(mesh);
            allOrgans.pancreas = group;
            return group;
        }

        // -- Small Intestine --
        function createSmallIntestine() {
            const group = new THREE.Group();
            const points = [];
            const loops = 8;
            for (let i = 0; i < loops * 20; i++) {
                const t = i / (loops * 20);
                const y = -0.8 - t * 3;
                const x = Math.sin(t * loops * Math.PI * 2) * (0.6 + t * 0.3);
                const z = Math.cos(t * loops * Math.PI * 2) * 0.3;
                points.push(new THREE.Vector3(x, y, z));
            }
            const curve = new THREE.CatmullRomCurve3(points);
            const geo = new THREE.TubeGeometry(curve, 200, 0.1, 8, false);
            const mesh = new THREE.Mesh(geo, createMaterial(organInfo.smallIntestine.color, 0.7));
            mesh.userData = { organ: 'smallIntestine' };
            group.add(mesh);
            clickableObjects.push(mesh);
            allOrgans.smallIntestine = group;
            return group;
        }

        // -- Large Intestine --
        function createLargeIntestine() {
            const group = new THREE.Group();
            const points = [
                new THREE.Vector3(1.2, -3.8, 0),    // Cecum (start)
                new THREE.Vector3(1.5, -3.2, 0),    // Ascending
                new THREE.Vector3(1.5, -2.0, 0),
                new THREE.Vector3(1.5, -1.0, 0),
                new THREE.Vector3(1.2, -0.5, 0),    // Hepatic flexure
                new THREE.Vector3(0.5, -0.5, 0),    // Transverse
                new THREE.Vector3(-0.5, -0.6, 0),
                new THREE.Vector3(-1.2, -0.7, 0),   // Splenic flexure
                new THREE.Vector3(-1.5, -1.0, 0),   // Descending
                new THREE.Vector3(-1.5, -2.0, 0),
                new THREE.Vector3(-1.5, -3.0, 0),
                new THREE.Vector3(-1.3, -3.5, 0),   // Sigmoid
                new THREE.Vector3(-0.8, -3.8, 0),
                new THREE.Vector3(-0.3, -4.0, 0),
            ];
            const curve = new THREE.CatmullRomCurve3(points);
            const geo = new THREE.TubeGeometry(curve, 60, 0.22, 12, false);
            const mesh = new THREE.Mesh(geo, createMaterial(organInfo.largeIntestine.color, 0.75));
            mesh.userData = { organ: 'largeIntestine' };
            group.add(mesh);
            clickableObjects.push(mesh);

            // Haustra bumps (characteristic pouches)
            for (let i = 0; i < 50; i++) {
                const t = i / 50;
                const pt = curve.getPointAt(t);
                const bump = new THREE.SphereGeometry(0.26, 8, 8);
                const bumpMesh = new THREE.Mesh(bump, createMaterial(organInfo.largeIntestine.color, 0.6));
                bumpMesh.position.copy(pt);
                bumpMesh.userData = { organ: 'largeIntestine' };
                group.add(bumpMesh);
                clickableObjects.push(bumpMesh);
            }

            allOrgans.largeIntestine = group;
            return group;
        }

        // -- Rectum --
        function createRectum() {
            const group = new THREE.Group();
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-0.3, -4.0, 0),
                new THREE.Vector3(-0.1, -4.3, 0),
                new THREE.Vector3(0, -4.6, 0),
            ]);
            const geo = new THREE.TubeGeometry(curve, 12, 0.2, 12, false);
            const mesh = new THREE.Mesh(geo, createMaterial(organInfo.rectum.color));
            mesh.userData = { organ: 'rectum' };
            group.add(mesh);
            clickableObjects.push(mesh);
            allOrgans.rectum = group;
            return group;
        }

        // ===== Build Scene =====
        const digestiveSystem = new THREE.Group();
        digestiveSystem.add(createMouth());
        digestiveSystem.add(createEsophagus());
        digestiveSystem.add(createStomach());
        digestiveSystem.add(createLiver());
        digestiveSystem.add(createGallbladder());
        digestiveSystem.add(createPancreas());
        digestiveSystem.add(createSmallIntestine());
        digestiveSystem.add(createLargeIntestine());
        digestiveSystem.add(createRectum());
        scene.add(digestiveSystem);

        // ===== Legend =====
        const legendEl = document.getElementById('legend');
        Object.keys(organInfo).forEach(key => {
            const info = organInfo[key];
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `<div class="legend-dot" style="background:#${info.color.toString(16).padStart(6,'0')}"></div><span>${info.name}</span>`;
            item.addEventListener('click', () => highlightOrgan(key));
            legendEl.appendChild(item);
        });

        // ===== Raycasting (Click) =====
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedOrgan = null;

        function onPointerDown(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);

            if (intersects.length > 0) {
                const organ = intersects[0].object.userData.organ;
                if (organ) highlightOrgan(organ);
            }
        }

        renderer.domElement.addEventListener('pointerdown', onPointerDown);

        function highlightOrgan(organKey) {
            // Reset all organs
            clickableObjects.forEach(obj => {
                if (obj.material) {
                    obj.material.emissive = new THREE.Color(0x000000);
                    obj.material.opacity = obj.material._originalOpacity || 0.85;
                }
            });

            // Store original opacities on first call
            clickableObjects.forEach(obj => {
                if (obj.material && obj.material._originalOpacity === undefined) {
                    obj.material._originalOpacity = obj.material.opacity;
                }
            });

            // Dim non-selected, highlight selected
            clickableObjects.forEach(obj => {
                if (obj.userData.organ === organKey) {
                    obj.material.emissive = new THREE.Color(0x332211);
                    obj.material.opacity = 1.0;
                } else {
                    obj.material.opacity = 0.25;
                }
            });

            selectedOrgan = organKey;

            // Update info panel
            const info = organInfo[organKey];
            const panel = document.getElementById('info-panel');
            panel.innerHTML = `
                <h2>${info.name}</h2>
                <p>${info.desc}</p>
                <div class="hint">לחץ על איבר אחר או גרור לסיבוב</div>
            `;
        }

        // Click on empty space to reset
        renderer.domElement.addEventListener('dblclick', () => {
            clickableObjects.forEach(obj => {
                if (obj.material) {
                    obj.material.emissive = new THREE.Color(0x000000);
                    obj.material.opacity = obj.material._originalOpacity || 0.85;
                }
            });
            selectedOrgan = null;
            document.getElementById('info-panel').innerHTML = `
                <h2>מערכת העיכול</h2>
                <p>לחץ על איבר כלשהו כדי ללמוד עליו. גרור כדי לסובב את המודל.</p>
                <div class="hint">מודל אינטראקטיבי תלת מימדי</div>
            `;
        });

        // ===== Animation =====
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Gentle floating
            digestiveSystem.rotation.y = Math.sin(t * 0.3) * 0.05;
            digestiveSystem.position.y = Math.sin(t * 0.5) * 0.1;

            // Pulse effect on selected organ
            if (selectedOrgan) {
                clickableObjects.forEach(obj => {
                    if (obj.userData.organ === selectedOrgan && obj.material) {
                        const pulse = 0.9 + Math.sin(t * 3) * 0.1;
                        obj.material.opacity = pulse;
                    }
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ===== Resize =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===== Particle background =====
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 200;
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 30;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x4466aa, size: 0.03, transparent: true, opacity: 0.5 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);
    })();
    </script>
</body>
</html>
